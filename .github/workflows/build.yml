name: Build and Push

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
          tags: |
            ghcr.io/agggroanalytics/frontend:latest
            ghcr.io/agggroanalytics/frontend:sha-${{ github.sha }}

      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: AgggroAnalytics/infrastructure
          event-type: deploy
          client-payload: '{"service": "frontend", "tag": "sha-${{ github.sha }}"}'
